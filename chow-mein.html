      <body>
        <h1>Chow Mein</h1>
          <p>Serves: 5</p>

            <h2>Ingredients</h2>
              <ul>
                  <li>1/2 cabbage</li>
                      <li>300 g green beans</li>
                          <li>500 g beef mince</li>
                              <li>1 tbsp curry powder</li>
                                  <li>2 packets chicken noodle soup</li>
                                      <li>2 tbsp soy sauce</li>
                                          <li>1 brown onion</li>
                                              <li>5 celery sticks</li>
                                                  <li>Rice (optional)</li>
                                                    </ul>
